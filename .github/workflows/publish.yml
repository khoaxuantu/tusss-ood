name: Publish Core Package

on:
  push:
    tags:
      - "v*" # Trigger only when you push a tag like v1.0.0

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Deno
        uses: denoland/setup-deno@v2
      - name: Install dependencies
        run: pnpm --filter @tusss/ood install
      - name: Test
        run: pnpm core:test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm --filter @tusss/ood install
      - name: Build Core
        run: pnpm core:build
      - name: Publish to NPM
        run: pnpm publish --filter @tusss/ood --no-git-checks
